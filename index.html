<!DOCTYPE html>

<head>

<!--"Toggle Preview - ctrl+shift+v or cmd+shift+v"-->
<!--"Open Preview to the Side - ctrl+k v or cmd+k v"-->
<body>
    <header>
        <h1>Lumber Tycoon 2 wood price calculator</h1>
    </header>


    
    <section id="input">
        <div>
            <label for="sizeX">X:</label>
            <input type="number" id="sizeX" name="X" min="0.2" max="3"> <p>(Between 0.2 and 3)</p>

            <label for="sizeY">Y:</label>
            <input type="number" id="sizeY" name="Y" min="0.2" max="2.4"> <p>(Between 0.2 and 2.4)</p>

            <label for="sizeZ">Z:</label>
            <input type="number" id="sizeZ" name="Z" min="0.2" max="99999">

            <button id="startprogram">Calculate</button>
            <script src="script.js"></script>
        </div>
    </section>
